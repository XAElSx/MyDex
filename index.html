<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDex</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e1e1e">
</head>
<body>
  <header>
    <h1>MyDex</h1>
    <select id="game" aria-label="Game"></select>
    <details id="sync-panel">
      <summary>Sync <span id="sync-status"></span></summary>
      <div class="sync-body">
        <div class="sync-row">
          <input id="gist-token" type="password" autocomplete="off" aria-label="GitHub token">
          <button id="gist-save">Connect</button>
        </div>
        <div class="sync-row">
          <button id="sync-now">Sync now</button>
          <button id="gist-disconnect">Disconnect</button>
        </div>
        <div class="sync-row">
          <button id="export">Export file</button>
          <label class="button">Import file<input id="import" type="file" accept=".json,application/json" hidden></label>
        </div>
      </div>
    </details>
  </header>

  <div id="backup-banner" role="status" hidden>
    <span id="backup-text"></span>
    <button id="backup-export">Export</button>
    <button id="backup-close" aria-label="Dismiss">✕</button>
  </div>

  <div id="controls">
    <input id="search" type="search" placeholder="Search by name or number" aria-label="Search">
    <div class="view-wrap">
      <button id="view-btn" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-label="View"></button>
      <div id="view-menu" role="menu" hidden></div>
    </div>
  </div>

  <div id="progress">
    <span id="progress-count"></span>
    <div class="bar"><div class="bar-fill"></div></div>
    <span id="progress-shiny" class="shiny-count"></span>
  </div>

  <details id="gens" hidden>
    <summary>Progress per generation</summary>
    <div id="gen-list"></div>
  </details>

  <div id="tabs" role="tablist" aria-label="Filter">
    <button class="tab" role="tab" data-filter="all">All</button>
    <button class="tab" role="tab" data-filter="caught">Caught</button>
    <button class="tab" role="tab" data-filter="missing">Missing</button>
    <button class="tab" role="tab" data-filter="shiny">Shiny</button>
    <button class="tab" role="tab" data-filter="living">Living Dex</button>
    <button class="tab" role="tab" data-filter="exclusive" id="tab-exclusive" hidden>Exclusives</button>
    <button class="tab" role="tab" data-filter="best" id="tab-best" hidden>Best catch</button>
  </div>

  <div id="subtabs" role="tablist" aria-label="Version" hidden></div>

  <p id="hint">Tap: caught · Hold: shiny · Double tap (PC: triple click): living dex</p>

  <div id="dex"></div>

  <dialog id="peek" aria-labelledby="peek-name">
    <form method="dialog">
      <button id="peek-close" aria-label="Close">×</button>
      <img id="peek-img" alt="" crossorigin="anonymous" draggable="false">
      <p class="peek-meta">
        <span id="peek-num"></span>
        <span id="peek-version" class="version" hidden></span>
      </p>
      <h2 id="peek-name"></h2>
      <p id="peek-best" hidden></p>
      <div class="peek-marks">
        <button type="button" data-mark="caught" aria-pressed="false">Caught</button>
        <button type="button" data-mark="shiny" aria-pressed="false">Shiny</button>
        <button type="button" data-mark="living" aria-pressed="false">Living Dex</button>
      </div>
      <label class="peek-origin">Caught in
        <select id="peek-origin"></select>
      </label>
      <section id="peek-evo" class="peek-set" hidden>
        <h3>Evolution</h3>
        <div id="peek-evo-chain" class="evo-chain"></div>
      </section>
      <section id="peek-set" class="peek-set" hidden>
        <h3>Best set <span id="peek-set-source"></span></h3>
        <dl>
          <dt>Ability</dt><dd id="peek-ability"></dd>
          <dt>Nature</dt><dd id="peek-nature"></dd>
          <dt>Moves</dt><dd><ul id="peek-moves"></ul></dd>
        </dl>
      </section>
    </form>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
